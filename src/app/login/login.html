<div class="container mt-5" style="max-width: 400px;">
  <div >
    <h3 >ورود به پنل</h3>



    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-2">
        <label class="form-label">نام کاربری</label>
        <input class="form-control" formControlName="username" />
        @if (loginForm.controls.username.touched && loginForm.controls.username.invalid) {
        <small >نام کاربری حداقل ۳ کاراکتر</small>
        }
      </div>

      <div class="mb-2">
        <label class="form-label">رمز عبور</label>
        <input type="password" class="form-control" formControlName="password" />
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
        <small >رمز حداقل 6 کاراکتر</small>
        }
      </div>

      <div class="mb-3">
        <label class="form-label">کد کپچا</label>
        <input class="form-control" formControlName="captcha" />
        
       
        

        <div style="margin-top:15px;">
          @if (captchaUrl()) {
          <img [src]="captchaUrl()" alt="captcha"  />
          }
          <!-- <button class="btn btn-secondary btn-sm mb-3" (click)="loadCaptcha()">🔄 کپچای جدید</button> -->
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">ورود</button>
    </form>

    @if (message()) {
    <p class="mt-2" [class.text-danger]="isError()">{{ message() }}</p>
    }
  </div>
</div>
